<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: Plex; src: url("assets/fonts/IBMPlexSansThai-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Plex; src: url("assets/fonts/IBMPlexSansThai-Bold.ttf"); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      color: #30281f;
      background:
        linear-gradient(rgba(95,83,61,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95,83,61,.05) 1px, transparent 1px),
        #f7f1e5;
      background-size: 26px 26px;
      font-family: Plex, sans-serif;
    }
    body::before { content: ""; position: absolute; top: -230px; right: -100px; width: 560px; height: 560px; border-radius: 50%; background: rgba(154,219,210,.35); }
    .copy { position: relative; z-index: 2; padding: 70px 30px 45px 74px; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 45px; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; color: #173253; background: #9adbd2; border: 2px solid #30281f; border-radius: 13px; box-shadow: 4px 5px 0 #687466; }
    .eyebrow { margin: 0 0 12px; color: #a8731c; font-size: 15px; font-weight: 700; letter-spacing: .13em; }
    h1 { margin: 0; color: #173253; font-size: 68px; line-height: 1.06; letter-spacing: -.035em; }
    h1 span { color: #cc972e; }
    .promise { margin: 22px 0 0; font-size: 27px; font-weight: 700; }
    .pack { display: inline-flex; margin-top: 34px; padding: 10px 16px; color: white; background: #738b48; border: 2px solid #30281f; border-radius: 12px; box-shadow: 4px 5px 0 rgba(48,40,31,.2); font-size: 18px; font-weight: 700; }
    .visual { position: relative; display: grid; place-items: center; padding: 42px 55px 42px 10px; }
    .visual img { position: relative; z-index: 2; width: 330px; border-radius: 5px; box-shadow: 17px 20px 0 #514637, 0 30px 50px rgba(48,40,31,.25); transform: rotate(2deg); }
    .price { position: absolute; z-index: 3; right: 46px; bottom: 50px; padding: 13px 19px; background: #fffaf0; border: 2px solid #30281f; border-radius: 14px; box-shadow: 5px 6px 0 rgba(48,40,31,.24); font-size: 18px; font-weight: 700; }
    .price b { color: #cc972e; font-size: 31px; }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand"><span class="mark">TP</span><span>Trading Psychology</span></div>
    <p class="eyebrow">CORE PRACTICE PACK</p>
    <h1>จิตวิทยาการเทรด<br><span>ฉบับลงมือทำ</span></h1>
    <p class="promise">จาก “รู้ว่าควรทำ” สู่ “ทำได้จริง”</p>
    <span class="pack">Core Set · Guided Set</span>
  </section>
  <section class="visual">
    <img src="assets/ebook-cover.png" alt="">
    <div class="price">เริ่มต้น <b>790</b> บาท</div>
  </section>
</body>
</html>
